### NGINX-PROXY
### Works in Swarm Mode, see swarm/README.md
###
### Author: Sebastian Plocek
### https://github.com/sebastian13/docker-compose-nginx-proxy
###
### Keep in sync with ../docker-compose.yml. Differences by design:
###  - ports in host mode, one container per node (deploy.mode: global)
###  - absolute volume paths, as the stack is deployed from any directory
###  - certbot runs via the scripts in this directory, not as a service
###  - www-network is created by the stack as an encrypted overlay network

services:
  nginx:
    image: nginx
    ports:
      - target: 443
        published: 443
        protocol: tcp
        mode: host
      - target: 443
        published: 443
        protocol: udp # for HTTP/3
        mode: host
      - target: 80
        published: 80
        protocol: tcp
        mode: host
    volumes:
      - /docker/00-nginx-proxy/www:/var/www:ro
      - /docker/00-nginx-proxy/conf.d:/etc/nginx/conf.d:ro
      - /docker/00-nginx-proxy/ssl:/etc/nginx/ssl:ro
      - /docker/00-nginx-proxy/snippets:/etc/nginx/snippets:ro
      - /docker/00-nginx-proxy/protect:/etc/nginx/protect:ro
    networks:
      - attachable
    deploy:
      mode: global
      update_config:
        parallelism: 1
        delay: 30s
      restart_policy:
        condition: any
        delay: 30s
        max_attempts: 120
        window: 30s
      endpoint_mode: dnsrr

# Use the same network in $upstream services and containers.
networks:
  attachable:
    name: www-network
    driver: overlay
    attachable: true
    driver_opts:
      encrypted: "true"
