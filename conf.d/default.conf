server {
  listen 80 default_server;
  listen [::]:80 default_server ipv6only=on;

  listen 443 ssl default_server;
  listen [::]:443 ssl default_server ipv6only=on;

  # HTTP/3: reuseport and default_server may only be set once per address:port,
  # so they live here. Sites use a plain "listen 443 quic;".
  listen 443 quic reuseport default_server;
  listen [::]:443 quic reuseport default_server;
  quic_retry on;

  http2 on;

  # No Alt-Svc header here: the catch-all serves nothing (444).
  # Sites advertise HTTP/3 themselves, see example.com.

  # Catch-all
  server_name _;

  # Serve Let's Encrypt verification files
  include snippets/certbot-standalone.conf;

  # Set default SSL parameters
  include snippets/ssl.conf;

  # Self signed cert as a fallback and to handle the 'no "ssl_certificate" is defined' error log message
  ssl_certificate     ssl/test/selfsigned.crt;
  ssl_certificate_key ssl/test/selfsigned.key;

  # Return nothing
  location / {
    return 444;
  }
}
