## http-wide defaults of the nginx-proxy template.
## Part of the template: do not edit on a server, use custom-nginx.conf instead.

# Merge add_header of a location with the headers of the server level
# (ssl.conf: HSTS, nosniff, CSP). Without this, a single add_header in a
# location silently drops all security headers. Requires nginx >= 1.29.3.
# To drop the inherited headers in a location: add_header_inherit off;
add_header_inherit merge;

# WebSocket support, used by snippets/proxy.conf:
# "Connection: upgrade" if the client requests an upgrade, otherwise "close".
# https://nginx.org/en/docs/http/websocket.html
map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}
