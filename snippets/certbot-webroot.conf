# Let's Encrypt HTTP-01 challenge, served from the webroot
# (certbot certonly --webroot -w /var/www).
location ^~ /.well-known/acme-challenge/ {
    # Let's Encrypt must always pass, even on sites that restrict access on
    # the server level (allow/deny, auth_basic). Only challenge files are
    # served here. Own access rules replace the inherited ones.
    allow all;
    auth_basic off;

    default_type "text/plain";
    alias /var/www/.well-known/acme-challenge/;
}
