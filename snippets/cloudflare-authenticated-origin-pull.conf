# Cloudflare Authenticated Origin Pulls (mTLS between Cloudflare and nginx)
# https://developers.cloudflare.com/ssl/origin-configuration/authenticated-origin-pull/
#
# nginx only accepts TLS connections that present Cloudflare's client
# certificate. Direct requests to the server IP get "400 No required SSL
# certificate was sent", so no allow list for Cloudflare's IP ranges is needed.
#
# Enable "Authenticated Origin Pulls" in the Cloudflare dashboard FIRST
# (SSL/TLS > Origin Server), then include this snippet. The other way round,
# every request fails with 400 until the switch is on.
#
# Shared certificate: Cloudflare presents the same certificate for all
# customers. It blocks direct access to the origin, but not requests routed
# through another Cloudflare account that points to this server. To rule that
# out, upload your own client certificate (zone-level or per-hostname AOP) and
# point ssl_client_certificate at your own CA.
#
# CA: ssl/authenticated_origin_pull_ca.pem (public, tracked in git)
# Source: https://developers.cloudflare.com/ssl/static/authenticated_origin_pull_ca.pem
# Valid until: Nov 1 2029
# SHA-256: 9A:1A:C2:B4:BE:15:F9:F2:7E:EE:20:A7:34:CB:A4:E9:89:8F:61:00:1B:3B:D7:C8:4B:69:B5:6A:3E:25:A2:B9
# Verify: openssl x509 -in ssl/authenticated_origin_pull_ca.pem -noout -fingerprint -sha256 -enddate
ssl_verify_client on;
ssl_client_certificate ssl/authenticated_origin_pull_ca.pem;
