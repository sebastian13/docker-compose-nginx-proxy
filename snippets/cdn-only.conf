# Only accept requests that came through the CDN of the real-<provider>.conf
# included in the same server block. For CDNs without client certificates,
# e.g. BunnyCDN. Cloudflare: use cloudflare-authenticated-origin-pull.conf.
#
# Why not allow-<provider>-ipv*.conf: real-<provider>.conf replaces the client
# address with the visitor IP before allow/deny is checked, so an allow list of
# CDN ranges would deny every visitor. Instead, compare the addresses: the
# realip module only replaces $remote_addr if the connection comes from a CDN
# range. If it was not replaced ($realip_remote_addr = connecting address),
# the request did not come through the CDN.
#
# Placed on the server level, this runs before every location, including the
# ACME challenge. That is fine: Let's Encrypt reaches the site through the CDN
# as well.
#
# Requests routed through another customer's pull zone of the same CDN pass.
# For more, let the CDN add a secret request header and check it here.
if ($realip_remote_addr = $remote_addr) {
  return 403;
}
