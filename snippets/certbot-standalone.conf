# Let's Encrypt HTTP-01 challenge, answered by the certbot container
# (certbot certonly/renew --standalone, run with --use-aliases).
location ^~ /.well-known/acme-challenge/ {
    # Let's Encrypt must always pass, even on sites that restrict access on
    # the server level (allow/deny, auth_basic). Only challenge files are
    # served here. Own access rules replace the inherited ones.
    allow all;
    auth_basic off;

    default_type "text/plain";
    resolver 127.0.0.11 valid=30s;
    set $certbot certbot:80;
    proxy_pass http://$certbot;
}
