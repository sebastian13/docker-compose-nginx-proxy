# Optional, stricter security headers. NOT included by default.
#
# ssl.conf already sets the important ones for every site:
# HSTS, X-Content-Type-Options and CSP frame-ancestors.
#
# Include on server level, after ssl.conf, only for sites where you know the
# application, and check the browser console after enabling:
#   include snippets/security-headers-strict.conf;
#
# If the application sends one of these headers itself, the browser receives
# it twice and applies the stricter one. Remove the line here in that case.

# Send only the origin to other sites. This is the browser default anyway,
# setting it explicitly protects older browsers. Breaks nothing.
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# Deny access to browser features.
# BREAKS: video calls (camera, microphone), QR code scanners (camera),
# maps with "my location" (geolocation), Apple Pay / Google Pay (payment).
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

# Isolate the window from popups of other origins.
# BREAKS: login and payment popups (SSO via popup, PayPal, Stripe), as the
# popup can no longer report back to the page. Redirect-based logins work.
add_header Cross-Origin-Opener-Policy "same-origin" always;

# Content-Security-Policy in report-only mode: blocks nothing, only reports
# violations in the browser console. Check the console on all pages, adjust,
# then switch to "Content-Security-Policy" to enforce it. When enforcing,
# remove frame-ancestors here or keep it identical to ssl.conf.
add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

# Do not reveal the backend technology
proxy_hide_header X-Powered-By;
