# To generate run 'openssl dhparam -out ssl/dhparams4096.pem 4096'
ssl_dhparam /etc/nginx/ssl/dhparams4096.pem;

# SSL session cache
ssl_session_timeout 1h;
ssl_session_cache shared:SSL:5m;
ssl_session_tickets off;

# TLS Support
ssl_protocols TLSv1.2 TLSv1.3;
ssl_ciphers 'EECDH+AESGCM:EDH+AESGCM';
ssl_prefer_server_ciphers on;
# Key exchange groups: no ssl_ecdh_curve, so nginx uses the OpenSSL defaults.
# They include X25519 and, with OpenSSL >= 3.5, hybrid post-quantum X25519MLKEM768.

# Docker DNS, required for variable upstreams (set $upstream ...)
resolver 127.0.0.11 ipv6=off valid=600s;
resolver_timeout 5s;

# Reduce ssl buffer size
ssl_buffer_size 4k;

# Security headers. "always" sends them on error pages (4xx/5xx) as well.
# Further optional headers: snippets/security-headers-strict.conf

# Enable HSTS
add_header Strict-Transport-Security 'max-age=63072000; includeSubDomains; preload' always;

# Prevent the browser from doing MIME-type sniffing
add_header X-Content-Type-Options nosniff always;

# Avoid click-jacking attacks
# The frame-ancestors directive obsoletes the X-Frame-Options header.
add_header Content-Security-Policy "frame-ancestors 'self';" always;
